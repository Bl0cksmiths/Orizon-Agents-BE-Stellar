# Lint/type-check configuration only — packaging stays requirements.txt-based
# and pytest keeps its config in pytest.ini.
[tool.ruff]
line-length = 120
# Ruff formats Python fenced in Markdown, and CI runs `ruff format --check .`
# over the whole tree. That is wrong for these files. `docs/decisions/*` and the
# operator guides carry ILLUSTRATIVE pseudo-Python — interface sketches with
# column-aligned trailing comments, and `def f() -> None: ...` stubs whose
# explanatory comment sits under the ellipsis. The formatter de-indents those
# continuation comments to column 0, detaching them from what they annotate,
# and expands the stubs so the comment lands after the body instead of
# describing it. The alignment IS the content in a spec document, so the fix is
# to leave them alone rather than to accept a worse document to satisfy a check.
# Lint still covers them; only the formatter is excluded.
[tool.ruff.format]
exclude = ["docs/**/*.md"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# agno and stellar-sdk ship without stubs; don't let that block adoption.
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
# Demo kits are embedded literal payloads, not logic.
omit = ["app/demo_kits/kits/*"]

[tool.coverage.report]
# Coverage reached 85.6% once the failure paths (step errors, settlement,
# ramp logging, proxy trust) got tests. Floor ratcheted to keep that, with
# headroom for the still-thin signing paths in app/stellar/client.py.
fail_under = 82
skip_covered = true
show_missing = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Demo kits embed long literal payload strings (HTML/JS artifacts); wrapping
# them would corrupt the demo content.
[tool.ruff.lint.per-file-ignores]
"app/demo_kits/kits/*" = ["E501"]
