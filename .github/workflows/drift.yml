name: Contract drift

# The contract address check, run on its own, away from any pull request.
# ci.yml runs the same check, but only when this repo changes — and the
# canonical address book lives in the contracts repo, which has no CI of its
# own. A redeploy there that rewrites addresses.json is otherwise first noticed
# when an unrelated backend PR goes red, and blamed on whoever opened it.
on:
  # Daily, so a contracts redeploy surfaces within a day, on this workflow and
  # not on a stranger's PR. Off the hour on purpose: GitHub delays, and under
  # load drops, scheduled runs queued at :00. Worth knowing about schedules:
  # they only ever run the default branch's copy of this file; the failure
  # email goes to whoever last edited the cron line; and in a public repo
  # GitHub disables them after 60 days without activity, so a quiet repo needs
  # the workflow re-enabled from the Actions tab.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Contract address drift
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mirrors ci.yml's checkout of the (public) contracts repo exactly, so
      # the two runs compare the same files and cannot disagree about drift.
      # Default branch, shallow: the question is what the contracts repo says
      # NOW, and that is precisely what changes without this repo noticing.
      - name: Checkout contract address book
        uses: actions/checkout@v4
        with:
          repository: Bl0cksmiths/Orizon-Agents-Smart-Contract-Stellar
          path: contracts
          fetch-depth: 1

      # The check is standard-library only, so there is nothing to install —
      # but it runs on the interpreter CI pins, so a pass here and a pass there
      # mean the same thing.
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The same command as ci.yml's step of the same name. Exit 1 is drift,
      # and exit 2 — a source missing or unattributable — fails the run too:
      # a check that goes quiet when its input disappears is the silence it
      # exists to break (scripts/check_contract_drift.py).
      - name: Contract address drift
        run: python scripts/check_contract_drift.py contracts
