name: CI

on:
  push:
    branches: [main, "Update-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A real Postgres 16 for the dispute store's SQL (tests/conftest.py
    # `pg_dsn`). The refund mutex, the verdict compare-and-set and the row lock
    # every append queues on all live in that SQL, and a fake pool can only
    # restate what it was meant to do — ten of eleven mutants to it once passed
    # the whole suite. 16 because it is what the audit proved the SQL on.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orizon
          POSTGRES_PASSWORD: orizon
          POSTGRES_DB: orizon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orizon -d orizon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Typecheck
        run: mypy

      # The canonical contract address book lives in the (public) contracts
      # repo. Checking it out beside this one keeps the drift check offline:
      # fetching the map over HTTPS at test time would make the check depend on
      # someone else's uptime, and a flaky check is a check that gets disabled.
      # It lands after the linters on purpose — `ruff ... .` walks the whole
      # workspace, and this repo's lint gate should not answer for another
      # repo's files.
      - name: Checkout contract address book
        uses: actions/checkout@v4
        with:
          repository: Bl0cksmiths/Orizon-Agents-Smart-Contract-Stellar
          path: contracts
          fetch-depth: 1

      # Fails when addresses.json, .env.example and render.yaml do not name the
      # same contracts. A mismatch is otherwise invisible: reputation reads fail
      # open, so a wrong ledger address serves every agent the Bayesian prior
      # and the marketplace looks like unrated newcomers rather than broken.
      - name: Contract address drift
        run: python scripts/check_contract_drift.py contracts

      # ORIZON_TEST_PG_REQUIRED turns every way the real-Postgres tests could
      # quietly not run into a failure: the DSN unset or unreachable, one of
      # them skipped, or none of them collected at all (tests/conftest.py).
      - name: Test (with coverage gate)
        run: python -m pytest -q --cov
        env:
          ORIZON_TEST_PG_DSN: postgresql://orizon:orizon@localhost:5432/orizon_test
          ORIZON_TEST_PG_REQUIRED: "1"
