services:
  - type: web
    name: orizon-agents-be
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: .
    # Hash-verified install from the lockfile; regenerate with
    # `uv pip compile requirements.txt -o requirements.lock --python-version 3.12 --generate-hashes`.
    buildCommand: pip install -r requirements.lock
    # Render terminates all ingress, so trusting X-Forwarded-* from any peer is
    # safe here; keep-alive sits above the edge idle timeout for SSE, and the
    # in-app request log supersedes uvicorn's access log.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*' --timeout-keep-alive 65 --no-access-log --limit-concurrency 200
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── Secrets — set these in the Render dashboard, never in git ──────
      - key: OPENAI_API_KEY
        sync: false
      # Claude (planner, prompt improver, workers) and jev (the intent guard).
      # With ANTHROPIC_API_KEY set the orchestrator runs on Claude
      # (ORCHESTRATOR_PROVIDER=auto); without TYPESAFE_API_KEY the guard falls
      # back to Claude Haiku 4.5 and never fails open.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
      - key: STELLAR_SIGNING_KEY
        sync: false
      # REQUIRED whenever this service holds money-capable credentials — a
      # mainnet STELLAR_SIGNING_KEY or production PDAX credentials. The config
      # validator refuses to boot without it, because an empty API_KEY makes
      # require_api_key a no-op and leaves the withdrawal, charge and seal
      # routes anonymous. Clearing this value takes the service down; that is
      # deliberate, and safer than serving those routes unauthenticated.
      - key: API_KEY
        sync: false
      # The shared secret the frontend's server-side route handlers send as
      # X-Frontend-Proxy-Token, so their X-Orizon-Client-Ip names the visitor
      # for rate limiting (README: "Rate limiting and who the client is").
      # Same value on Vercel; at least 32 random characters. Unset, the
      # frontend is just another caller keyed by Vercel's shared egress.
      - key: FRONTEND_PROXY_TOKEN
        sync: false
      # The rate limiters find the visitor past Render's own hops by address
      # (non-public, then one Cloudflare edge), so they need no hop count; this
      # only shapes the access log's client= field, and 0 is right here.
      - key: TRUSTED_PROXY_HOPS
        value: "0"
      # Postgres connection string for every durable store this service has:
      # the operator-endpoint bindings (story 2.01), and the settlement and
      # dispute records the refund path is built on (stories 4.02-4.04). Left
      # UNSET the service still boots and all three still work — they just
      # live in memory and are lost on the next deploy or idle spin-down.
      # That is fine for a demo and NOT fine for a deployment that adjudicates:
      # a settlement that never persisted is a dispute that can never be
      # opened, and a dispute that never persisted is a buyer who cannot be
      # paid. Nothing announces the fallback. Paste a Neon connection string
      # here to make all of it durable; no code change is needed, the store
      # implementation is selected from this value alone.
      # Not a free Render Postgres: that tier expires after 30 days.
      - key: DATABASE_URL
        sync: false

      # ── HTTP ────────────────────────────────────────────────────────────
      - key: CORS_ORIGINS
        value: https://orizons.xyz,https://www.orizons.xyz,https://orizon-agents-fe-stellar.vercel.app,http://localhost:3000

      # ── Models ──────────────────────────────────────────────────────────
      - key: ORCHESTRATOR_MODEL
        value: gpt-5.3-codex
      - key: WORKER_MODEL
        value: gpt-5.3-codex
      # Orchestrator v2 (app/llm/). The values are the code's defaults,
      # spelled out so the dashboard shows what is in force. auto = Claude once
      # ANTHROPIC_API_KEY is set, OpenAI until then; anthropic/openai force one.
      - key: ORCHESTRATOR_PROVIDER
        value: auto
      # One exact Claude id per tier; the planner runs on the complex tier's
      # model, the prompt improver on the moderate one, the fallback guard on
      # the low one.
      - key: CLAUDE_MODEL_LOW
        value: claude-haiku-4-5
      - key: CLAUDE_MODEL_MODERATE
        value: claude-sonnet-5-5
      - key: CLAUDE_MODEL_COMPLEX
        value: claude-opus-5-5
      # Per-attempt HTTP bound and the SDK's retries of 408/409/429/5xx.
      - key: CLAUDE_TIMEOUT_SECONDS
        value: "120"
      - key: CLAUDE_MAX_RETRIES
        value: "2"
      # Server-side refusal fallbacks (beta) on Opus 5.5 / Sonnet 5.5. Set
      # false if the org is not enabled for server-side-fallback-2026-07-01:
      # every Opus and Sonnet call would otherwise be refused with a 400.
      - key: CLAUDE_SERVER_FALLBACKS
        value: "true"
      # The jev model the guard asks, pinned so a release cannot move the
      # guard's thresholds; and jev's whole retry budget per question set.
      - key: TYPESAFE_MODEL
        value: jev-1.13.0
      - key: JEV_TIMEOUT_SECONDS
        value: "8"
      - key: JEV_MAX_RETRIES
        value: "2"
      # Daily AI spend ceiling in USD per UTC day, Claude and jev together.
      # At the cap AI planning pauses with a notice; curated demo kits still
      # run. 0 pauses it outright.
      - key: LLM_DAILY_SPEND_CAP_USD
        value: "10"

      # ── Stellar (mainnet — production) ─────────────────────────────────
      # Mainnet is the production target; testnet values live in
      # .env.example for local dev. NOTE: the Render dashboard env
      # OVERRIDES this file — paste these values there to actually
      # flip the live service. The SDF public RPC is rate-limited —
      # move to a dedicated provider at scale.
      - key: STELLAR_NETWORK
        value: mainnet
      - key: STELLAR_RPC_URL
        value: https://mainnet.sorobanrpc.com
      - key: STELLAR_NETWORK_PASSPHRASE
        value: "Public Global Stellar Network ; September 2015"
      - key: STELLAR_AGENT_REGISTRY
        value: CBTJ3BXTMTA2PQLRTSAZHEWQRTBMNHYCOKY5WOIYAH36LT4HTN63LTD4
      - key: STELLAR_REPUTATION_LEDGER
        value: CDFWQJY72GPH7PEQVFGBDZESZNVRF6LQLVWU42CFMWPGRME5RWN5AXSX
      - key: STELLAR_PAYMENT_ESCROW
        value: CBJCQBA47Q3EQ7HC46GAWJPVM7KMD5KAEI5KG4FPYJFKR3NYB4QR5CNF
      - key: STELLAR_ATTESTATION_REGISTRY
        value: CBLV6QGFCMXBXHT62JZ7YH22NXW7MVBGV6TGOGX3OHY46GQGPYCTAAK4
      - key: STELLAR_ASSET_SAC
        value: CAS3J7GYLGXMF6TDJBBYYSE3HQ6BBSMLNUQ34T6TZMYMW2EVH34XOWMA
      - key: STELLAR_ADMIN_ADDRESS
        value: GA7AI5TAJEZA27I666DSJC4MUJYBEWUYNNZWPU7R2ONA7IZQVO6R5OQV

      # ── PDAX (PHP <-> crypto on/off-ramp) ──────────────────────────────
      # Staging requires your Render outbound IPs be whitelisted by PDAX.
      - key: PDAX_ENVIRONMENT
        value: stage
      - key: PDAX_USERNAME
        sync: false
      - key: PDAX_PASSWORD
        sync: false
      - key: PDAX_OTP_SECRET
        sync: false
      - key: PDAX_WEBHOOK_SECRET
        sync: false
