# SonarQube scan configuration for the Orizon Agents backend.

sonar.projectKey=Bl0cksmiths_Orizon-Agents-BE-Stellar
sonar.projectName=Orizon Agents BE (Stellar)
sonar.sourceEncoding=UTF-8

# Production code, the operator scripts and the eval harness are all source;
# tests are scanned under the test rule set, not mixed into the source counts.
sonar.sources=app,scripts,evals
sonar.tests=tests

# runtime.txt pins python-3.12.4 and mypy checks against 3.12.
sonar.python.version=3.12

# Coverage comes from pytest-cov's Cobertura XML at the repo root, which
# `python -m pytest --cov --cov-report=xml` writes. [tool.coverage.run] in
# pyproject.toml measures `app` only, so scripts/ and evals/ read as uncovered
# until that source list grows. The demo kits are omitted there as literal
# payloads rather than logic, and are kept out of the coverage figure here too.
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=app/demo_kits/kits/**
